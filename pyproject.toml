[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fleat"
version = "0.1.2"
description = "A very limited Bleak complement for accessing Bluetooth LE on Android in Python apps made with Flet"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyjnius",
]
license = { text = "MIT" }

[tool.setuptools]
license-files = ["LICEN[CS]E*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fleat*"]

[tool.setuptools.package-data]
fleat = [
    "java/*.java",
]

[project.urls]
Homepage = "https://github.com/MarkusPiotrowski/fleat"
Issues = "https://github.com/MarkusPiotrowski/fleat/issues"
